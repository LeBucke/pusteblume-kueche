<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Speiseplan Oktober</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dosis:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#4F6A22}a:hover{color:#3B5118}
</style>
</helmet>
<div style="min-height: 1080px; box-sizing: border-box; background: #F3F0E7; color: #2F3527; font-family: 'Nunito', 'Trebuchet MS', sans-serif; position: relative; overflow: hidden">

  <div style="position: absolute; left: -120px; top: -140px; width: 300px; height: 300px; border-radius: 50%; background: #B3D6DC; opacity: 0.6"></div>

  <div style="max-width: 1280px; margin: 0 auto; padding: 0 32px 48px; box-sizing: border-box; position: relative">

    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding: 20px 0 18px">
      <img src="/_blob/7e2886b94c5f003f78ca0eb1639e92ad" alt="Kindertagesstätte Pusteblume" style="height: 48px; width: auto; display: block">
      <nav aria-label="Bereiche" style="display: flex; flex-wrap: wrap; gap: 6px">
        <a href="Main.dc.html" style="font-family: 'Dosis', sans-serif; font-weight: 600; font-size: 18px; text-decoration: none; color: #5B5A4C; padding: 10px 18px; border-radius: 999px">Heute</a>
        <a href="Speiseplan.dc.html" aria-current="page" style="font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 18px; text-decoration: none; color: #2F3527; background: #FFFDF8; padding: 10px 18px; border-radius: 999px; box-shadow: 0 0 0 1.5px #5F7C2B">Speiseplan</a>
        <a href="#" style="font-family: 'Dosis', sans-serif; font-weight: 600; font-size: 18px; text-decoration: none; color: #5B5A4C; padding: 10px 18px; border-radius: 999px">Rezepte</a>
        <a href="#" style="font-family: 'Dosis', sans-serif; font-weight: 600; font-size: 18px; text-decoration: none; color: #5B5A4C; padding: 10px 18px; border-radius: 999px">Vorlagen</a>
        <a href="Einkauf.dc.html" style="font-family: 'Dosis', sans-serif; font-weight: 600; font-size: 18px; text-decoration: none; color: #5B5A4C; padding: 10px 18px; border-radius: 999px">Einkauf</a>
      </nav>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 15px; color: #5B5A4C">
        <span style="width: 34px; height: 34px; border-radius: 50%; background: #E6DDEA; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; color: #5E4A78">P</span>
        Planung
      </div>
    </header>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin: 8px 0 14px">
      <button aria-label="Vorheriger Monat" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #D9D2C1; background: #FFFDF8; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F3527" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <h1 style="margin: 0; font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 42px; line-height: 1">Oktober 2026</h1>
      <button aria-label="Nächster Monat" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #D9D2C1; background: #FFFDF8; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F3527" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg></button>
      <div style="display: flex; background: #E9E3D4; border-radius: 999px; padding: 4px; margin-left: 8px">
        <button style="height: 38px; padding: 0 18px; border-radius: 999px; border: 0; background: #FFFDF8; font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 16px; color: #2F3527; cursor: pointer">Monat</button>
        <button style="height: 38px; padding: 0 18px; border-radius: 999px; border: 0; background: transparent; font-family: 'Dosis', sans-serif; font-weight: 600; font-size: 16px; color: #5B5A4C; cursor: pointer">Woche</button>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto">
        <button style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #D9D2C1; background: #FFFDF8; font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 16px; color: #2F3527; cursor: pointer">Rotation anwenden</button>
        <button style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #D9D2C1; background: #FFFDF8; font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 16px; color: #2F3527; cursor: pointer">Aushang drucken</button>
        <a href="Eltern-Woche.dc.html" style="height: 44px; padding: 0 20px; border-radius: 999px; background: #5F7C2B; font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 16px; color: #FFFFFF; text-decoration: none; display: inline-flex; align-items: center">Elternansicht öffnen</a>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 18px; font-size: 14px; color: #5B5A4C; margin-bottom: 14px">
      <span style="display: inline-flex; align-items: center; gap: 7px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #B5CCB2"></span>Vorspeise</span>
      <span style="display: inline-flex; align-items: center; gap: 7px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #F4D779"></span>Hauptgang</span>
      <span style="display: inline-flex; align-items: center; gap: 7px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #C9B5D9"></span>Nachtisch</span>
      <span style="display: inline-flex; align-items: center; gap: 7px"><span style="width: 22px; height: 14px; border-radius: 4px; background: #F6E1D0"></span>Allergene</span>
    </div>

    <div style="overflow-x: auto">
      <div style="min-width: 940px; display: grid; grid-template-columns: 92px repeat(5, minmax(0, 1fr)); gap: 8px">
        <span></span>
        <span style="font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 16px; color: #5B5A4C; padding: 0 6px">Montag</span>
        <span style="font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 16px; color: #5B5A4C; padding: 0 6px">Dienstag</span>
        <span style="font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 16px; color: #5B5A4C; padding: 0 6px">Mittwoch</span>
        <span style="font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 16px; color: #5B5A4C; padding: 0 6px">Donnerstag</span>
        <span style="font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 16px; color: #5B5A4C; padding: 0 6px">Freitag</span>

        <sc-for list="{{weeks}}" as="w" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 4px 0 0">
            <span style="font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 18px">KW {{w.kw}}</span>
            <span style="font-size: 13px; color: #5B5A4C; line-height: 1.3">{{w.vorlage}}</span>
          </div>
          <sc-for list="{{w.days}}" as="d" hint-placeholder-count="5">
            <sc-if value="{{d.isOut}}" hint-placeholder-val="{{ false }}">
              <div style="min-height: 150px; border-radius: 18px; border: 1.5px dashed #DED7C6; padding: 10px 12px; box-sizing: border-box">
                <span style="font-family: 'Dosis', sans-serif; font-weight: 600; font-size: 18px; color: #A8A492">{{d.num}}</span>
              </div>
            </sc-if>
            <sc-if value="{{d.isClosed}}" hint-placeholder-val="{{ false }}">
              <div style="min-height: 150px; border-radius: 18px; background: #EAD8B2; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
                <span style="font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 18px">{{d.num}}</span>
                <span style="font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 17px; color: #6E5612">Geschlossen</span>
                <span style="font-size: 14px; color: #4A4B3E">{{d.reason}}</span>
              </div>
            </sc-if>
            <sc-if value="{{d.isEmpty}}" hint-placeholder-val="{{ false }}">
              <button style="min-height: 150px; border-radius: 18px; border: 1.5px dashed #C9C1AC; background: transparent; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; cursor: pointer; font-family: inherit; color: #2F3527; text-align: left">
                <span style="font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 18px">{{d.num}}</span>
                <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #4F6A22"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F6A22" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Tag planen</span>
              </button>
            </sc-if>
            <sc-if value="{{d.isPlanned}}" hint-placeholder-val="{{ true }}">
              <button style="min-height: 150px; border-radius: 18px; border: 0; background: #FFFDF8; box-shadow: {{d.ring}}; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 5px; align-items: stretch; cursor: pointer; font-family: inherit; color: #2F3527; text-align: left">
                <span style="display: flex; align-items: center; gap: 8px">
                  <span style="font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 18px">{{d.num}}</span>
                  <sc-if value="{{d.isToday}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 800; color: #6E5612; background: #FAEBC0; padding: 1px 8px; border-radius: 999px">heute</span></sc-if>
                </span>
                <span style="display: flex; gap: 7px; align-items: baseline; font-size: 13px; color: #4A4B3E; line-height: 1.3"><span style="flex: none; width: 9px; height: 9px; border-radius: 50%; background: #B5CCB2"></span>{{d.v}}</span>
                <span style="display: flex; gap: 7px; align-items: baseline; font-size: 15px; font-weight: 800; line-height: 1.25"><span style="flex: none; width: 9px; height: 9px; border-radius: 50%; background: #F4D779"></span>{{d.h}}</span>
                <span style="display: flex; gap: 7px; align-items: baseline; font-size: 13px; color: #4A4B3E; line-height: 1.3"><span style="flex: none; width: 9px; height: 9px; border-radius: 50%; background: #C9B5D9"></span>{{d.n}}</span>
                <span style="margin-top: auto; align-self: flex-start; font-size: 12px; font-weight: 700; color: #8A5430; background: #F6E1D0; padding: 1px 8px; border-radius: 999px">{{d.al}}</span>
              </button>
            </sc-if>
          </sc-for>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const P = (num, v, h, n, al, today) => ({ num, v, h, n, al, isPlanned: true, isToday: !!today, ring: today ? '0 0 0 2.5px #E2C55E' : '0 0 0 1px #E2DCCD', isOut: false, isClosed: false, isEmpty: false });
    const O = (num) => ({ num, isOut: true, isPlanned: false, isClosed: false, isEmpty: false, isToday: false });
    const E = (num) => ({ num, isEmpty: true, isPlanned: false, isClosed: false, isOut: false, isToday: false });
    const C = (num, reason) => ({ num, reason, isClosed: true, isPlanned: false, isEmpty: false, isOut: false, isToday: false });
    return {
      weeks: [
        { kw: 40, vorlage: 'Herbst 1', days: [O('28.'), O('29.'), O('30.'),
          P('1.', 'Gurkensalat', 'Spinat-Reis-Auflauf', 'Obst', 'Milch'),
          P('2.', 'Apfel-Möhren-Salat', 'Gemüsesuppe mit Baguette', 'Bananenquark', 'Gluten, Milch, Sellerie')] },
        { kw: 41, vorlage: 'Herbst 2', days: [
          P('5.', 'Rohkost mit Dipp', 'Kartoffelgratin', 'Obst', 'Gluten, Milch', true),
          P('6.', 'Apfel-Möhren-Salat', 'Buchstabensuppe', 'Bananenquark', 'Gluten, Milch, Sellerie'),
          P('7.', 'Gurkensalat', 'Nudel-Spinat-Auflauf', 'Obst', 'Gluten, Milch'),
          P('8.', 'Tomatensalat mit Feta', 'Reispuffer mit Dipp', 'Mandarinenquark', 'Eier, Milch'),
          P('9.', 'Rohkost mit Dipp', 'Kartoffel-Zucchini-Gratin', 'Obst', 'Milch')] },
        { kw: 42, vorlage: 'Herbst 3', days: [
          P('12.', 'Möhrencarpaccio', 'Gemüserisotto', 'Obst', 'Milch, Sellerie'),
          P('13.', 'Salat mit Croutons', 'Flammenkuchen', 'Marmorgriesbrei', 'Gluten, Milch'),
          P('14.', 'Rohkost mit Dipp', 'Eintopf mit Chinakohl', 'Obst', 'Milch, Sellerie'),
          P('15.', 'Gurkensalat', 'Möhrenrisotto mit Nuggets', 'Mandarinenquark', 'Gluten, Milch, Soja'),
          P('16.', 'Apfel-Möhren-Salat', 'Bröselkartoffeln mit Dipp', 'Obst', 'Gluten, Milch')] },
        { kw: 43, vorlage: 'Herbst 4', days: [
          P('19.', 'Gurkensalat', 'Kartoffelgratin', 'Obst', 'Gluten, Milch'),
          P('20.', 'Rohkost mit Dipp', 'Buchstabensuppe', 'Bananenquark', 'Gluten, Milch, Sellerie'),
          E('21.'), E('22.'), C('23.', 'Teamfortbildung')] },
        { kw: 44, vorlage: 'Herbst 5', days: [E('26.'), E('27.'), E('28.'), E('29.'), E('30.')] }
      ]
    };
  }
}
</script>
</body>
</html>
