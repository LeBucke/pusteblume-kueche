<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Einkaufsliste</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dosis:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#4F6A22}a:hover{color:#3B5118}
</style>
</helmet>
<div style="width: 390px; height: 1440px; box-sizing: border-box; background: #F3F0E7; color: #2F3527; font-family: 'Nunito', 'Trebuchet MS', sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">

  <div style="position: absolute; right: -70px; top: -70px; width: 180px; height: 180px; border-radius: 50%; background: #B3D6DC; opacity: 0.7"></div>

  <header style="display: flex; align-items: center; gap: 12px; padding: 18px 20px 6px; position: relative">
    <img src="/_blob/7e2886b94c5f003f78ca0eb1639e92ad" alt="Kindertagesstätte Pusteblume" style="height: 36px; width: auto; display: block">
  </header>

  <div style="padding: 6px 20px 0; position: relative">
    <h1 style="margin: 0; font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.1">Einkauf</h1>
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px">
      <button aria-label="Vorige Woche" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #D9D2C1; background: #FFFDF8; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F3527" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <span style="flex: 1; text-align: center; font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 18px">Mo 5.10. bis Fr 9.10.</span>
      <button aria-label="Nächste Woche" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #D9D2C1; background: #FFFDF8; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F3527" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg></button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #E9E3D4; border-radius: 999px; padding: 4px; margin-top: 14px">
      <button onClick="{{pickBauer}}" style="height: 44px; border-radius: 999px; border: 0; background: {{bauerBg}}; font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 17px; color: #2F3527; cursor: pointer">Bio-Bauer</button>
      <button onClick="{{pickGross}}" style="height: 44px; border-radius: 999px; border: 0; background: {{grossBg}}; font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 17px; color: #2F3527; cursor: pointer">Großhandel</button>
    </div>

    <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 14px; color: #5B5A4C"><span>{{doneText}}</span><span>live mit allen Geräten</span></div>
      <div style="height: 8px; border-radius: 999px; background: #E2DCCD; overflow: hidden"><div style="height: 8px; border-radius: 999px; background: #5F7C2B; width: {{progress}}"></div></div>
    </div>
  </div>

  <div style="flex: 1; padding: 6px 20px 120px; display: flex; flex-direction: column; gap: 4px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <h2 style="margin: 16px 0 4px; font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 18px; color: #5B5A4C">{{g.name}}</h2>
      <div style="background: #FFFDF8; border-radius: 20px; padding: 2px 14px">
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
          <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: {{it.border}}; cursor: pointer">
            <input type="checkbox" checked="{{it.checked}}" onChange="{{it.toggle}}" style="width: 24px; height: 24px; accent-color: #5F7C2B; flex: none; margin: 0">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 8px 0">
              <span style="font-size: 16px; font-weight: 700; color: {{it.color}}; text-decoration: {{it.deco}}">{{it.name}}</span>
              <span style="font-size: 12px; color: #6B6A5C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.from}}</span>
            </span>
            <span style="font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 18px; color: {{it.color}}; white-space: nowrap">{{it.amount}}</span>
          </label>
        </sc-for>
      </div>
    </sc-for>

    <h2 style="margin: 16px 0 4px; font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 18px; color: #5B5A4C">Vorrat prüfen</h2>
    <p style="margin: 0; font-size: 15px; color: #4A4B3E; line-height: 1.5; background: #FAEBC0; border-radius: 16px; padding: 10px 14px">Salz, Pfeffer, Muskat, Gekörnte Brühe, Vanillepulver</p>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 22px; background: #F3F0E7; border-top: 1px solid #E2DCCD; display: flex; gap: 10px">
    <button style="height: 52px; flex: 1; border-radius: 999px; border: 0; background: #5F7C2B; font-family: 'Dosis', sans-serif; font-weight: 700; font-size: 18px; color: #FFFFFF; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>Für WhatsApp kopieren</button>
    <button aria-label="Zusatzartikel hinzufügen" style="width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid #D9D2C1; background: #FFFDF8; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F3527" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1440}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'bauer', checked: { k1: true, k2: true, o1: true, m1: true, g1: true } };
  }
  renderVals() {
    const data = {
      bauer: [
        { name: 'Gemüse', items: [
          ['k1', 'Kartoffeln, festkochend', '11,1 kg', 'Kartoffelgratin, Kartoffel-Zucchini-Gratin'],
          ['k2', 'Möhren', '4,2 kg', 'Rohkost mit Dipp, Apfel-Möhren-Salat, Buchstabensuppe'],
          ['k3', 'Gurken', '6 St.', 'Gurkensalat, Rohkost mit Dipp'],
          ['k4', 'Kohlrabi', '5 St.', 'Rohkost mit Dipp, Buchstabensuppe'],
          ['k5', 'Tomaten', '800 g', 'Tomatensalat mit Feta'],
          ['k6', 'Zucchini', '1 kg', 'Kartoffel-Zucchini-Gratin'],
          ['k7', 'Lauch', '500 g', 'Buchstabensuppe']
        ] },
        { name: 'Obst', items: [
          ['o1', 'Äpfel', '2,5 kg', 'Obst, Apfel-Möhren-Salat'],
          ['o2', 'Birnen', '1,4 kg', 'Obst'],
          ['o3', 'Bananen', '1,7 kg', 'Obst, Bananenquark']
        ] },
        { name: 'Milchprodukte', items: [
          ['m1', 'Milch', '5,4 l', 'Kartoffelgratin, Kartoffel-Zucchini-Gratin'],
          ['m2', 'Quark', '2 kg', 'Bananenquark, Mandarinenquark'],
          ['m3', 'Gouda', '2 kg', 'Kartoffelgratin, Nudel-Spinat-Auflauf, Gratin'],
          ['m4', 'Sahne', '1,9 l', 'Kartoffelgratin, Nudel-Spinat-Auflauf'],
          ['m5', 'Joghurt', '1,5 l', 'Rohkost mit Dipp, Quarkspeisen']
        ] }
      ],
      gross: [
        { name: 'Getreide und Teigwaren', items: [
          ['g1', 'Nudeln', '1,5 kg', 'Nudel-Spinat-Auflauf'],
          ['g2', 'Buchstabennudeln', '250 g', 'Buchstabensuppe'],
          ['g3', 'Reis', '1 kg', 'Reispuffer mit Dipp']
        ] },
        { name: 'Tiefkühl', items: [
          ['t1', 'TK Erbsen', '900 g', 'Buchstabensuppe'],
          ['t2', 'TK Blattspinat', '7 Pckg.', 'Nudel-Spinat-Auflauf']
        ] },
        { name: 'Konserven und Gläser', items: [
          ['c1', 'Mandarinen', '2 Dosen', 'Mandarinenquark']
        ] }
      ]
    };
    const groups = data[this.state.tab];
    let all = 0, done = 0;
    const shaped = groups.map((g) => ({
      name: g.name,
      items: g.items.map((it, i) => {
        const checked = !!this.state.checked[it[0]];
        all += 1; if (checked) done += 1;
        return {
          name: it[1], amount: it[2], from: it[3], checked,
          color: checked ? '#8C8A7A' : '#2F3527',
          deco: checked ? 'line-through' : 'none',
          border: i === g.items.length - 1 ? '0' : '1px solid #ECE6D8',
          toggle: () => this.setState({ checked: { ...this.state.checked, [it[0]]: !checked } })
        };
      })
    }));
    return {
      groups: shaped,
      doneText: done + ' von ' + all + ' erledigt',
      progress: Math.round(done / all * 100) + '%',
      bauerBg: this.state.tab === 'bauer' ? '#FFFDF8' : 'transparent',
      grossBg: this.state.tab === 'gross' ? '#FFFDF8' : 'transparent',
      pickBauer: () => this.setState({ tab: 'bauer' }),
      pickGross: () => this.setState({ tab: 'gross' })
    };
  }
}
</script>
</body>
</html>
